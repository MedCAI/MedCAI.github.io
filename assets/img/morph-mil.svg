<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Semi-supervised cancer prognosis framework</title>
  <desc id="desc">Whole-slide image features flow through Morph-MIL and a dynamic memory bank to produce temporal pseudo-labels and survival-risk predictions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3182bd"/>
      <stop offset="1" stop-color="#de6b48"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#547087"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="20" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#233a50">Semi-supervised WSI Survival Modeling</text>

  <g transform="translate(34 86)">
    <rect width="150" height="130" rx="12" fill="#fff" stroke="#b9c9d8" stroke-width="2"/>
    <path d="M20 20h110v68H20z" fill="#f4dbe5" stroke="#bb8297"/>
    <g fill="#9c4f74" opacity=".78">
      <circle cx="43" cy="42" r="8"/><circle cx="71" cy="54" r="10"/><circle cx="104" cy="39" r="7"/>
      <circle cx="50" cy="73" r="9"/><circle cx="91" cy="75" r="12"/><circle cx="122" cy="67" r="6"/>
    </g>
    <text x="75" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334d63">WSI cohorts</text>
  </g>

  <path d="M190 151h48" stroke="#547087" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(250 76)">
    <rect width="194" height="150" rx="14" fill="#fff" stroke="#6996ba" stroke-width="2"/>
    <text x="97" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#245a87">Morph-MIL</text>
    <g transform="translate(20 45)">
      <rect width="68" height="70" rx="8" fill="#dcebf5"/>
      <circle cx="21" cy="21" r="9" fill="#4f8db8"/><circle cx="47" cy="22" r="9" fill="#7ea9c7"/>
      <circle cx="34" cy="48" r="12" fill="#2f6f9d"/>
      <text x="34" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4c6274">morphology</text>
    </g>
    <g transform="translate(106 45)">
      <rect width="68" height="70" rx="8" fill="#f2e1d8"/>
      <path d="M15 52l12-18 12 9 14-24" fill="none" stroke="#c46948" stroke-width="5"/>
      <circle cx="27" cy="34" r="5" fill="#c46948"/><circle cx="39" cy="43" r="5" fill="#c46948"/><circle cx="53" cy="19" r="5" fill="#c46948"/>
      <text x="34" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4c6274">semantics</text>
    </g>
  </g>

  <path d="M450 151h45" stroke="#547087" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(508 76)">
    <rect width="258" height="150" rx="14" fill="#fff" stroke="#8fa9b8" stroke-width="2"/>
    <text x="129" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334d63">Dynamic memory bank</text>
    <g transform="translate(26 48)">
      <rect width="206" height="18" rx="5" fill="#dfe9f0"/>
      <rect y="27" width="168" height="18" rx="5" fill="#cbddea"/>
      <rect y="54" width="188" height="18" rx="5" fill="#b7d0e2"/>
      <g fill="#487fa6"><circle cx="16" cy="9" r="5"/><circle cx="16" cy="36" r="5"/><circle cx="16" cy="63" r="5"/></g>
      <text x="116" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4c6274">labeled patient references</text>
    </g>
  </g>

  <path d="M638 235v42" stroke="#547087" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(400 292)">
    <rect width="366" height="116" rx="14" fill="#fff" stroke="#b9c9d8" stroke-width="2"/>
    <text x="183" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334d63">Temporal labels → survival risk</text>
    <g transform="translate(28 45)">
      <rect width="310" height="22" rx="7" fill="#e7edf2"/>
      <rect width="62" height="22" rx="7" fill="#8eb8d5"/>
      <rect x="62" width="62" height="22" fill="#6da3c7"/>
      <rect x="124" width="62" height="22" fill="#4c89b2"/>
      <rect x="186" width="62" height="22" fill="#b88975"/>
      <rect x="248" width="62" height="22" rx="7" fill="#d26f4f"/>
      <g font-family="Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">
        <text x="31" y="43">t1</text><text x="93" y="43">t2</text><text x="155" y="43">t3</text><text x="217" y="43">t4</text><text x="279" y="43">t5</text>
      </g>
    </g>
  </g>

  <path d="M347 235v62" stroke="#547087" stroke-width="3"/>
  <path d="M347 297h43" stroke="#547087" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#4c6274">unlabeled patients</text>
</svg>
